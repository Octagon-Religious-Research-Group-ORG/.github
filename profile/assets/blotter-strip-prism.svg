<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 120" width="1280" height="120" role="img" aria-label="A perforated blotter strip printed with ORG's octagon">
<style>
.flow{animation:flow 40s ease-in-out infinite alternate}
@keyframes flow{to{transform:translateX(-320px)}}
.motif{transform-box:view-box;transform-origin:640px 60px;animation:motif 9s ease-in-out infinite alternate}
@keyframes motif{from{opacity:0.59}to{opacity:0.85}}
.perfs{transform-box:view-box;transform-origin:640px 60px;animation:perfs 10s ease-in-out -5s infinite alternate}
@keyframes perfs{from{opacity:.6}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="bands" x1="0" y1="0" x2="320" y2="120" gradientUnits="userSpaceOnUse" spreadMethod="reflect"><stop offset="0.000" stop-color="#ffb3c7"/><stop offset="0.125" stop-color="#f5f3fa"/><stop offset="0.250" stop-color="#ffd9a0"/><stop offset="0.375" stop-color="#f5f3fa"/><stop offset="0.500" stop-color="#a8e3f5"/><stop offset="0.625" stop-color="#f5f3fa"/><stop offset="0.750" stop-color="#c9b8ff"/><stop offset="0.875" stop-color="#f5f3fa"/><stop offset="1.000" stop-color="#ffb3c7"/></linearGradient>
<pattern id="perf" width="40" height="40" patternUnits="userSpaceOnUse"><g stroke="#221d33" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="0 5" fill="none"><line x1="0" y1="0.5" x2="40" y2="0.5"/><line x1="0.5" y1="0" x2="0.5" y2="40"/></g></pattern>
<pattern id="art" width="80" height="80" patternUnits="userSpaceOnUse"><g><polygon points="20,20 30.2,24.2 24.2,30.2" fill="#5a43f0"/><polygon points="20,20 24.2,30.2 15.8,30.2" fill="#9a4dff"/><polygon points="20,20 15.8,30.2 9.8,24.2" fill="#d04ce8"/><polygon points="20,20 9.8,24.2 9.8,15.8" fill="#e65aa8"/><polygon points="20,20 9.8,15.8 15.8,9.8" fill="#f29a3a"/><polygon points="20,20 15.8,9.8 24.2,9.8" fill="#e4d548"/><polygon points="20,20 24.2,9.8 30.2,15.8" fill="#6fd84a"/><polygon points="20,20 30.2,15.8 30.2,24.2" fill="#3ccfe0"/><polygon points="30.2,24.2 24.2,30.2 15.8,30.2 9.8,24.2 9.8,15.8 15.8,9.8 24.2,9.8 30.2,15.8" fill="none" stroke="#fff8e8" stroke-width="1.6"/><circle cx="20" cy="20" r="3" fill="#ffffff"/></g><g transform="translate(40 40)"><polygon points="20,20 30.2,24.2 24.2,30.2" fill="#5a43f0"/><polygon points="20,20 24.2,30.2 15.8,30.2" fill="#9a4dff"/><polygon points="20,20 15.8,30.2 9.8,24.2" fill="#d04ce8"/><polygon points="20,20 9.8,24.2 9.8,15.8" fill="#e65aa8"/><polygon points="20,20 9.8,15.8 15.8,9.8" fill="#f29a3a"/><polygon points="20,20 15.8,9.8 24.2,9.8" fill="#e4d548"/><polygon points="20,20 24.2,9.8 30.2,15.8" fill="#6fd84a"/><polygon points="20,20 30.2,15.8 30.2,24.2" fill="#3ccfe0"/><polygon points="30.2,24.2 24.2,30.2 15.8,30.2 9.8,24.2 9.8,15.8 15.8,9.8 24.2,9.8 30.2,15.8" fill="none" stroke="#fff8e8" stroke-width="1.6"/><circle cx="20" cy="20" r="3" fill="#ffffff"/></g></pattern>
<clipPath id="card"><rect width="1280" height="120" rx="14"/></clipPath>
</defs>
<g clip-path="url(#card)">
<rect width="1280" height="120" fill="#f5f3fa"/>
<rect class="flow" x="0" y="0" width="1920" height="120" fill="url(#bands)" opacity="0.55"/>
<rect class="motif" x="-20" y="0" width="1320" height="120" fill="url(#art)"/>
<rect class="perfs" width="1280" height="120" fill="url(#perf)" opacity="0.18"/>
<rect x="4" y="4" width="1272" height="112" rx="10" fill="none" stroke="#221d33" stroke-width="1.7" stroke-linecap="round" stroke-dasharray="0 5" opacity="0.4"/>
</g>
</svg>
